# Sina AI OS — server block for the EXISTING host nginx.
# Installed by deploy/scripts/deploy-on-server.sh as a NEW file:
#   /etc/nginx/sites-available/agent.rajastore.ir.conf
# It never modifies or overwrites any other nginx configuration.

upstream sina_api_host { server 127.0.0.1:18000; keepalive 16; }
upstream sina_web_host { server 127.0.0.1:13000; keepalive 16; }

server {
    listen 80;
    server_name agent.rajastore.ir;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 on this server: http2 is enabled on the listen line
    listen 443 ssl http2;
    server_name agent.rajastore.ir;

    # copied from the existing wildcard certificate on this server
    ssl_certificate     /etc/letsencrypt/live/rajastore.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajastore.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SINA:10m;

    client_max_body_size 30m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/sina-access.log;
    error_log  /var/log/nginx/sina-error.log;

    # API + Server-Sent Events (no buffering so streaming works)
    location /api/ {
        proxy_pass http://sina_api_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health { proxy_pass http://sina_api_host/health; access_log off; }
    location /api/docs { proxy_pass http://sina_api_host/api/docs; }

    # Dashboard (Next.js)
    location / {
        proxy_pass http://sina_web_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
